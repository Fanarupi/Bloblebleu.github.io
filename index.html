<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Aquarium ultra complet</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  margin:0;
  overflow:hidden;
  background:#000;
  font-family:Arial, sans-serif;
  color:#fff;
}

/* Message */
#message{
  position:absolute;
  top:20px;
  left:50%;
  transform:translateX(-50%);
  font-size:20px;
  z-index:20;
}

/* Aquarium fullscreen */
#aquarium{
  position:absolute;
  inset:0;
  background:radial-gradient(circle at 50% 15%, #5ee6ff, #00324f);
  overflow:hidden;
}

/* Modes (background + ambiance) */
body.mode-normal #aquarium{
  background:radial-gradient(circle at 50% 15%, #5ee6ff, #00324f);
}
body.mode-night #aquarium{
  background:radial-gradient(circle at 50% 10%, #4b3b8f, #050019);
}
body.mode-storm #aquarium{
  background:radial-gradient(circle at 50% 20%, #1b3b4f, #000000);
}

/* Water overlay */
.water-overlay{
  position:absolute;
  inset:0;
  background:rgba(255,255,255,0.05);
  mix-blend-mode:screen;
  animation:waterMove 6s ease-in-out infinite;
}
@keyframes waterMove{
  0%{transform:translateY(0);}
  50%{transform:translateY(25px);}
  100%{transform:translateY(0);}
}

/* Light beams */
.light-beam{
  position:absolute;
  top:-20%;
  width:20%;
  height:140%;
  background:linear-gradient(to bottom, rgba(255,255,255,0.25), transparent);
  filter:blur(4px);
  opacity:0.6;
  animation:beamMove 10s ease-in-out infinite;
}
.light-beam:nth-child(1){left:10%;}
.light-beam:nth-child(2){left:40%;animation-delay:2s;}
.light-beam:nth-child(3){left:70%;animation-delay:4s;}
@keyframes beamMove{
  0%{transform:translateX(0);}
  50%{transform:translateX(20px);}
  100%{transform:translateX(0);}
}

/* Sand floor */
.sand{
  position:absolute;
  bottom:0;
  width:100%;
  height:18%;
  background:radial-gradient(circle at 50% 0, #f5e0a8, #c9a86a);
}

/* Rocks */
.rock{
  position:absolute;
  bottom:12%;
  width:80px;
  height:40px;
  background:radial-gradient(circle at 30% 30%, #777, #333);
  border-radius:50px;
}
.rock.small{
  width:50px;
  height:25px;
}

/* Cave */
.cave{
  position:absolute;
  bottom:12%;
  left:35%;
  width:140px;
  height:80px;
  background

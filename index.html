<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Aquarium animé</title>

<style>
/* --- GLOBAL --- */
body {
  margin: 0;
  overflow: hidden;
  background: #000;
  font-family: Arial;
  color: white;
}

#message {
  position: absolute;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 22px;
  z-index: 10;
}

/* --- AQUARIUM FULLSCREEN --- */
#aquarium {
  display: none;
  position: absolute;
  width: 100vw;
  height: 100vh;
  background: radial-gradient(circle at 50% 20%, #4dd9ff, #003d66);
  overflow: hidden;
}

/* --- WATER MOVEMENT --- */
#aquarium::before {
  content: "";
  position: absolute;
  width: 100%;
  height: 100%;
  background: rgba(255,255,255,0.05);
  animation: water 6s ease-in-out infinite;
}
@keyframes water {
  0% { transform: translateY(0); }
  50% { transform: translateY(20px); }
  100% { transform: translateY(0); }
}

/* --- BUBBLES --- */
.bubble {
  position: absolute;
  bottom: -20px;
  width: 12px;
  height: 12px;
  background: rgba(255,255,255,0.6);
  border-radius: 50%;
  animation: rise 6s linear infinite;
}
@keyframes rise {
  0% { transform: translateY(0) scale(1); opacity: 1; }
  100% { transform: translateY(-120vh) scale(0.3); opacity: 0; }
}

/* --- ALGAE --- */
.algae {
  position: absolute;
  bottom: 0;
  width: 20px;
  height: 200px;
  background: linear-gradient(#0a4, #0f8);
  border-radius: 20px;
  animation: sway 3s ease-in-out infinite;
}
@keyframes sway {
  0% { transform: rotate(0deg); }
  50% { transform: rotate(6deg); }
  100% { transform: rotate(0deg); }
}

/* --- FISH BASE --- */
.fish {
  position: absolute;
  width: 90px;
  height: 45px;
  border-radius: 50px;
  box-shadow: 0 0 15px rgba(0,0,0,0.4);
}

/* --- FISH COLORS --- */
.fish.blue { background: #4da6ff; }
.fish.orange { background: #ff9c3d; }

/* --- FISH DETAILS --- */
.fish::after {
  content: "";
  position: absolute;
  left: 15px;
  top: 14px;
  width: 10px;
  height: 10px;
  background: #fff;
  border-radius: 50%;
  box-shadow: 3px 0 0 #000;
}
.fish::before {
  content: "";
  position: absolute;
  right: -25px;
  top: 12px;
  width: 0;
  height: 0;
  border-top: 12px solid transparent;
  border-bottom: 12px solid transparent;
  border-left: 25px solid currentColor;
  animation: tail 0.4s ease-in-out infinite;
}
@keyframes tail {
  0% { transform: rotate(0deg); }
  50% { transform: rotate(10deg); }
  100% { transform: rotate(0deg); }
}

/* --- FISH MOVEMENTS --- */
@keyframes swim {
  0% { transform: translateX(-150px); }
  50% { transform: translateX(100vw); }
  100% { transform: translateX(-150px); }
}
@keyframes randomMove {
  0% { transform: translate(0,0); }
  25% { transform: translate(20px,-10px); }
  50% { transform: translate(-15px,15px); }
  75% { transform: translate(10px,-5px); }
  100% { transform: translate(0,0); }
}
@keyframes circle {
  0% { transform: rotate(0deg) translateX(40px) rotate(0deg); }
  100% { transform: rotate(360deg) translateX(40px) rotate(-360deg); }
}

/* --- AXOLOTL --- */
.axolotl {
  position: absolute;
  width: 120px;
  height: 60px;
  border-radius: 60px;
  box-shadow: 0 0 15px rgba(0,0,0,0.4);
}

/* Pink axolotl */
.axolotl.pink { background: #ffd6e7; }

/* Black axolotl */
.axolotl.black { background: #333; }

/* Axolotl gills */
.axolotl::before, .axolotl::after {
  content: "";
  position: absolute;
  top: -10px;
  width: 6px;
  height: 25px;
  background: #ff8fb0;
  border-radius: 10px;
  animation: gills 1s ease-in-out infinite;
}
.axolotl::before {
  left: 15px;
  box-shadow: 12px 0 #ff8fb0, 24px 0 #ff8fb0;
}
.axolotl::after {
  right: 15px;
  box-shadow: -12px 0 #ff8fb0, -24px 0 #ff8fb0;
}
@keyframes gills {
  0% { transform: scaleY(1); }
  50% { transform: scaleY(1.3); }
  100% { transform: scaleY(1); }
}

/* Axolotl walking */
@keyframes walk {
  0% { transform: translateX(0); }
  50% { transform: translateX(40vw); }
  100% { transform: translateX(0); }
}

/* Axolotl swimming */
@keyframes swimSlow {
  0% { transform: translateX(-150px) translateY(-20px); }
  50% { transform: translateX(100vw) translateY(20px); }
  100% { transform: translateX(-150px) translateY(-20px); }
}
</style>
</head>

<body>

<div id="message">Tape le code secret pour révéler l’aquarium…</div>

<div id="aquarium">

  <!-- ALGAE -->
  <div class="algae" style="left:10%;"></div>
  <div class="algae" style="left:20%;"></div>
  <div class="algae" style="left:80%;"></div>

  <!-- BUBBLES -->
  <div class="bubble" style="left:30%; animation-delay:0s;"></div>
  <div class="bubble" style="left:50%; animation-delay:2s;"></div>
  <div class="bubble" style="left:70%; animation-delay:4s;"></div>

  <!-- FISH -->
  <div class="fish blue" style="top:20%; animation:swim 10s linear infinite;"></div>
  <div class="fish orange" style="top:40%; animation:randomMove 4s infinite;"></div>
  <div class="fish blue" style="top:60%; animation:circle 6s linear infinite;"></div>

  <!-- AXOLOTLS -->
  <div class="axolotl pink" style="bottom:10%; left:5%; animation:walk 12s linear infinite;"></div>
  <div class="axolotl black" style="top:30%; animation:swimSlow 18s linear infinite;"></div>

</div>

<script>
const SECRET_CODE = "bloblebleu";
let buffer = "";

document.addEventListener("keydown", (e) => {
  buffer += e.key.toLowerCase();
  if (buffer.length > SECRET_CODE.length) {
    buffer = buffer.slice(-SECRET_CODE.length);
  }
  if (buffer === SECRET_CODE) {
    revealAquarium();
  }
});

function revealAquarium() {
  document.getElementById("message").textContent =
    "Bienvenue dans ton aquarium animé 🐟🦎";
  document.getElementById("aquarium").style.display = "block";
}
</script>

</body>
</html>
